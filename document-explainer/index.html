<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocuMind Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="chat-page">
    <header class="topbar chat-topbar">
      <div class="brand">
        <div class="brand-icon">✦</div>
        <div>
          <h1>DocuMind</h1>
          <p>AI DOCUMENT ASSISTANT</p>
        </div>
      </div>
      <div class="backend-pill" id="backendPill"><span class="status-dot"></span> <span id="backendStatus">Checking assistant…</span></div>
    </header>

    <section class="chat-card chat-card-full">
      <div class="card-heading chat-heading">
        <div>
          <h3>Ask a question</h3>
          <p>Answers come only from the documents provided by your administrator.</p>
        </div>
        <button class="text-button" id="clearChat" type="button">Clear chat ↺</button>
      </div>

      <div class="chips" id="chips">
        <button class="chip" type="button" data-q="Summarize the documents in simple language.">Summarize documents</button>
        <button class="chip" type="button" data-q="What are the most important points?">Key points</button>
        <button class="chip" type="button" data-q="What data is available in the spreadsheets?">What data is available?</button>
      </div>

      <div class="chat-messages" id="chatMessages" aria-live="polite"></div>

      <form class="question-form" id="questionForm">
        <textarea id="question" rows="2" placeholder="Ask anything about the documents..." required></textarea>
        <button id="sendButton" class="button button-primary" type="submit">Ask <span>↗</span></button>
      </form>
      <p class="status" id="status" role="status"></p>
    </section>

    <footer class="page-footer">DocuMind <span>•</span> Answers list their sources. Verify important results.</footer>
  </main>
  <script src="common.js"></script>
  <script src="script.js"></script>
</body>
</html>
